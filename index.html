<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Array Hewan</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff0800, #d85778);
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #92400e;
      bottom: 30px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      padding: 20px;
      transition: 0.3s;
      border-left: 8px solid #5224fb;
    }

    .card:hover {
      transform: scale(1.05);
      background-color: #fef9c3;
    }

    .nama {
      font-size: 20px;
      font-weight: bold;
      color: #3b05ff;
    }

    .info {
      margin-top: 8px;
      color: #374151;
    }

    .habitat {
      background: #5f521e;
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      font-size: 14px;
      color: #fdfbfa;
    }

    .form {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      margin: 30px auto;
    }

    input, textarea, button {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      border: 1px solid #394e79;
      border-radius: 8px;
      font-size: 14px;
    }

    button {
      background-color: #6e69b1;
      color: rgb(94, 166, 194);
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #ece8e3;
    }
  </style>
</head>
<body>
  <h2><i>Jenis-Jenis Hewan Dan Ciri-Cirinya</i></h2>

  <div class="container" id="data-container"></div>

  <div class="form">
 
  </div>

  <script>
   
    let hewan = [
      {
        nama: "Kucing",
        jenis: "Karnivora kecil",
        ciri: "Berbulu lembut, suka bermain, dan sering dijadikan peliharaan.",
        habitat: "Rumah, perkotaan, dan sekitar manusia."
      },
      {
        nama: "Gajah",
        jenis: "Herbivora besar",
        ciri: "Memiliki belalai panjang, telinga besar, dan tubuh besar.",
        habitat: "Hutan tropis dan padang rumput di Asia dan Afrika."
      },
      {
        nama: "Elang",
        jenis: "Karnivora",
        ciri: "Memiliki paruh tajam dan penglihatan yang sangat baik.",
        habitat: "Pegunungan, hutan, dan daerah tinggi."
      }
    ];

    function tampilkanHewan() {
      let container = document.getElementById("data-container");
      container.innerHTML = "";

      hewan.forEach(item => {
        let card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="nama">${item.nama}</div>
          <div class="info"><b>Jenis:</b> ${item.jenis}</div>
          <div class="info"><b>Ciri-ciri:</b> ${item.ciri}</div>
          <div class="habitat"><b>Habitat:</b> ${item.habitat}</div>
        `;
        container.appendChild(card);
      });
    }

    function tambahHewan() {
      let nama = document.getElementById("nama").value.trim();
      let jenis = document.getElementById("jenis").value.trim();
      let ciri = document.getElementById("ciri").value.trim();
      let habitat = document.getElementById("habitat").value.trim();

      if (nama === "" || jenis === "") {
        alert("Nama dan jenis hewan wajib diisi!");
        return;
      }

      hewan.push({ nama, jenis, ciri, habitat });
      tampilkanHewan();

  
      document.getElementById("nama").value = "";
      document.getElementById("jenis").value = "";
      document.getElementById("ciri").value = "";
      document.getElementById("habitat").value = "";
    }

    tampilkanHewan();
  </script>
</body>
</html>
